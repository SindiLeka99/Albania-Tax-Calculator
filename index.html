        const AlbaniaSalaryCalculator = () => {
          const [language, setLanguage] = useState('en');
          const [calculatorType, setCalculatorType] = useState('individual');
          const [grossSalary, setGrossSalary] = useState('80000');
          const [currency, setCurrency] = useState('ALL');
          const [period, setPeriod] = useState('monthly');
          const [showBreakdown, setShowBreakdown] = useState(true);
          const [companyRevenue, setCompanyRevenue] = useState('10000000');
          const [companyExpenses, setCompanyExpenses] = useState('7000000');
          const [companyAdjustments, setCompanyAdjustments] = useState('0');
          const [companyIndustry, setCompanyIndustry] = useState('standard');
          const [companyCurrency, setCompanyCurrency] = useState('ALL');

          const t = translations[language];

          const industries = {
            'standard': { rate: 0.15 },
            'it': { rate: 0.15 },
            'agriculture': { rate: 0.05 },
            'agritourism': { rate: 0.05 },
            'automotive': { rate: 0.05 },
            'smallbusiness': { rate: 0 },
            'mediumbusiness': { rate: 0.15 },
            'selfemployed-small': { rate: 0.15 },
            'selfemployed-large': { rate: 0.23 },
            'luxury-hotel': { rate: 0 }
          };

          const calculateIndividualTax = () => {
            let inputAmount = parseFloat(grossSalary) || 0;
            let monthlyGross = period === 'annual' ? inputAmount / 12 : inputAmount;
            
            let minBracket, maxBracket, incomeTaxBracket;
            if (currency === 'ALL') {
              minBracket = 50000;
              maxBracket = 186416;
              incomeTaxBracket = 170000;
            } else if (currency === 'EUR') {
              minBracket = 400;
              maxBracket = 1500;
              incomeTaxBracket = 1400;
            } else { // USD
              minBracket = 450;
              maxBracket = 1650;
              incomeTaxBracket = 1550;
            }
            
            const employeeHealth = monthlyGross * 0.017;
            
            let socialSecurityBase;
            if (monthlyGross <= minBracket) {
              socialSecurityBase = minBracket;
            } else if (monthlyGross >= maxBracket) {
              socialSecurityBase = maxBracket;
            } else {
              socialSecurityBase = monthlyGross;
            }
            const employeeSocialSecurity = socialSecurityBase * 0.095;
            
            const totalEmployeeContributions = employeeSocialSecurity + employeeHealth;
            
            const employerSocialSecurity = socialSecurityBase * 0.15;
            const employerHealth = monthlyGross * 0.017;
            const totalEmployerContributions = employerSocialSecurity + employerHealth;
            
            const taxableIncome = monthlyGross - totalEmployeeContributions;
            
            let incomeTax = 0;
            if (taxableIncome <= incomeTaxBracket) {
              incomeTax = taxableIncome * 0.13;
            } else {
              incomeTax = (incomeTaxBracket * 0.13) + ((taxableIncome - incomeTaxBracket) * 0.23);
            }
            
            const netSalary = taxableIncome - incomeTax;
            const totalCost = monthlyGross + totalEmployerContributions;
            
            return {
              monthly: {
                gross: monthlyGross,
                employeeSocialSecurity,
                employeeHealth,
                socialSecurityBase,
                totalEmployeeContributions,
                incomeTax,
                net: netSalary,
                totalDeductions: totalEmployeeContributions + incomeTax,
                employerSocialSecurity,
                employerHealth,
                totalEmployerContributions,
                totalCost
              },
              annual: {
                gross: monthlyGross * 12,
                net: netSalary * 12
              }
            };
          };

          const calculateCompanyTax = () => {
            const revenue = parseFloat(companyRevenue) || 0;
            const expenses = parseFloat(companyExpenses) || 0;
            const adjustments = parseFloat(companyAdjustments) || 0;
            const grossProfit = revenue - expenses;
            const taxableProfit = grossProfit + adjustments;
            
            const taxRate = industries[companyIndustry].rate;
            const corporateTax = taxableProfit > 0 ? taxableProfit * taxRate : 0;
            const netProfit = taxableProfit - corporateTax;
            
            return {
              revenue,
              expenses,
              adjustments,
              grossProfit,
              taxableProfit,
              corporateTax,
              netProfit,
              taxRate: taxRate * 100,
              effectiveRate: taxableProfit > 0 ? (corporateTax / taxableProfit) * 100 : 0
            };
          };

          const individualResults = calculateIndividualTax();
          const companyResults = calculateCompanyTax();

          const formatCurrency = (amount, curr = currency) => {
            const decimals = curr === 'ALL' ? 0 : 2;
            return new Intl.NumberFormat('sq-AL', {
              style: 'currency',
              currency: curr,
              minimumFractionDigits: decimals,
              maximumFractionDigits: decimals
            }).format(amount);
          };

          return (
            <div className="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100">
              <div className="bg-gradient-to-r from-custom-green via-custom-green to-[#003314] text-white py-8 px-4 shadow-lg">
                <div className="max-w-6xl mx-auto">
                  <div className="flex items-center justify-between flex-wrap gap-4">
                    <div>
                      <div className="flex items-center gap-3 mb-2">
                        <Calculator />
                        <h1 className="text-4xl font-bold">{t.title}</h1>
                      </div>
                      <p className="text-green-100 text-lg">{t.subtitle}</p>
                    </div>
                    <div className="flex items-center gap-2 bg-white/10 rounded-lg p-1">
                      <button
                        onClick={() => setLanguage('en')}
                        className={`flex items-center gap-2 px-4 py-2 rounded-md font-medium transition-all ${
                          language === 'en' ? 'bg-white text-custom-green shadow' : 'text-white hover:bg-white/20'
                        }`}
                      >
                        <Globe />
                        EN
                      </button>
                      <button
                        onClick={() => setLanguage('sq')}
                        className={`flex items-center gap-2 px-4 py-2 rounded-md font-medium transition-all ${
                          language === 'sq' ? 'bg-white text-custom-green shadow' : 'text-white hover:bg-white/20'
                        }`}
                      >
                        <Globe />
                        AL
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <div className="max-w-6xl mx-auto px-4 py-6">
                <div className="bg-white rounded-xl shadow-lg p-2 inline-flex gap-2 border-2 border-custom-grey">

                    onClick={() => setCalculatorType('individual')}
                    className={`flex items-center gap-2 px-6 py-3 rounded-lg font-semibold transition-all ${
                      calculatorType === 'individual' ? 'bg-custom-green text-white shadow-md' : 'bg-gray-100 text-custom-grey hover:bg-gray-200'
                    }`}
                  >
                    <User />
                    {t.individual}
                  </button>
                  <button
                    onClick={() => setCalculatorType('company')}
                    className={`flex items-center gap-2 px-6 py-3 rounded-lg font-semibold transition-all ${
                      calculatorType === 'company' ? 'bg-custom-green text-white shadow-md' : 'bg-gray-100 text-custom-grey hover:bg-gray-200'
                    }`}
                  >
                    <Building2 />
                    {t.company}
                  </button>
                </div>
              </div>

              {calculatorType === 'individual' && (
                <div className="max-w-6xl mx-auto px-4 pb-8">
                  <div className="grid lg:grid-cols-3 gap-6">
                    <div className="lg:col-span-1">
                      <div className="bg-white rounded-lg shadow-md p-6 sticky top-4 border-2 border-custom-grey">
                        <h2 className="text-xl font-bold text-custom-grey mb-6">{t.salaryDetails}</h2>
                        
                        <div className="mb-6">
                          <label className="block text-sm font-semibold text-custom-grey mb-3">{t.payPeriod}</label>
                          <div className="grid grid-cols-2 gap-2">
                            {['monthly', 'annual'].map(p => (
                              <button key={p} onClick={() => setPeriod(p)} className={`py-2 px-4 rounded-lg font-medium transition-all ${period === p ? 'bg-custom-green text-white shadow' : 'bg-gray-100 text-custom-grey hover:bg-gray-200'}`}>
                                {p === 'monthly' ? t.monthly : t.annual}
                              </button>
                            ))}
                          </div>
                        </div>

                        <div className="mb-6">
                          <label className="block text-sm font-semibold text-custom-grey mb-3">{t.currency}</label>
                          <div className="grid grid-cols-3 gap-2">
                            {['ALL', 'EUR', 'USD'].map(curr => (
                              <button key={curr} onClick={() => setCurrency(curr)} className={`py-2 px-3 rounded-lg font-medium transition-all ${currency === curr ? 'bg-custom-green text-white shadow' : 'bg-gray-100 text-custom-grey hover:bg-gray-200'}`}>
                                {curr}
                              </button>
                            ))}
                          </div>
                        </div>

                        <div className="mb-6">
                          <label className="block text-sm font-semibold text-custom-grey mb-2">{t.grossSalary.replace('{period}', period === 'monthly' ? t.monthly : t.annual)}</label>
                          <div className="relative">
                            <input type="number" value={grossSalary} onChange={(e) => setGrossSalary(e.target.value)} className="w-full px-4 py-3 pr-16 border-2 border-custom-grey rounded-lg focus:border-custom-green focus:outline-none text-lg font-semibold" placeholder={currency === 'ALL' ? '80000' : currency === 'EUR' ? '650' : '730'} />
                            <span className="absolute right-4 top-1/2 transform -translate-y-1/2 text-custom-grey font-medium">{currency}</span>
                          </div>
                        </div>

                        <div className="bg-green-50 border-2 border-custom-green rounded-lg p-4">
                          <div className="flex gap-2">
                            <Info />
                            <div className="text-sm text-custom-green">
                              <p className="font-semibold mb-1">{t.taxRates}</p>
                              <ul className="space-y-1 text-xs">
                                <li>• {t.healthInsurance}: 1.7%</li>
                                <li>• {t.socialSecurity}: 9.5% (bracket-based)</li>
                                <li>• {t.incomeTax}: 13%, 23%</li>
                              </ul>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div className="lg:col-span-2 space-y-6">
                      <div className="bg-gradient-to-br from-green-500 to-green-600 rounded-lg shadow-lg p-8 text-white border-2 border-green-700">
                        <div className="flex items-center gap-2 mb-2">
                          <TrendingUp />
                          <h2 className="text-lg font-semibold">{t.netSalary}</h2>
                        </div>
                        <div className="flex items-baseline gap-4">
                          <div className="text-5xl font-bold">{formatCurrency(individualResults.monthly.net)}</div>
                          <div className="text-green-100 text-lg">{t.month}</div>
                        </div>
                        <div className="mt-4 pt-4 border-t border-green-400">
                          <div className="text-green-100 text-sm">{t.annualNet}</div>
                          <div className="text-2xl font-bold mt-1">{formatCurrency(individualResults.annual.net)}</div>
                        </div>
                      </div>

                      <div className="grid md:grid-cols-3 gap-4">
                        <div className="bg-white rounded-lg shadow p-5 border-l-4 border-custom-green">
                          <div className="text-sm text-custom-grey mb-1">{t.grossSalaryLabel}</div>
                          <div className="text-2xl font-bold text-custom-grey">{formatCurrency(individualResults.monthly.gross)}</div>
                        </div>
                        <div className="bg-white rounded-lg shadow p-5 border-l-4 border-custom-grey">
                          <div className="text-sm text-custom-grey mb-1">{t.totalDeductions}</div>
                          <div className="text-2xl font-bold text-custom-grey">{formatCurrency(individualResults.monthly.totalDeductions)}</div>
                        </div>
                        <div className="bg-white rounded-lg shadow p-5 border-l-4 border-custom-green">
                          <div className="text-sm text-custom-grey mb-1">{t.costToEmployer}</div>
                          <div className="text-2xl font-bold text-custom-green">{formatCurrency(individualResults.monthly.totalCost)}</div>
                        </div>
                      </div>

                      <button onClick={() => setShowBreakdown(!showBreakdown)} className="w-full bg-white rounded-lg shadow p-4 text-left font-semibold text-custom-grey hover:bg-gray-50 transition-colors flex items-center justify-between border-2 border-custom-grey">
                        <span>{t.detailedBreakdown}</span>
                        <span className="text-2xl">{showBreakdown ? '−' : '+'}</span>
                      </button>

                      {showBreakdown && (
                        <div className="bg-white rounded-lg shadow overflow-hidden border-2 border-custom-grey">
                          <div className="bg-gray-100 px-6 py-3 border-b-2 border-custom-grey">
                            <h3 className="font-bold text-custom-grey flex items-center gap-2">
                              <TrendingDown />
                              {t.employeeDeductions}
                            </h3>
                          </div>
                          <div className="divide-y divide-gray-200">
                            <div className="px-6 py-4 flex justify-between items-center">
                              <div>
                                <div className="font-medium text-custom-grey">{t.healthInsurance}</div>
                                <div className="text-sm text-gray-500">1.7% of gross salary</div>
                              </div>
                              <div className="text-right">
                                <div className="font-bold text-custom-grey">{formatCurrency(individualResults.monthly.employeeHealth)}</div>
                              </div>
                            </div>
                            <div className="px-6 py-4 flex justify-between items-center bg-blue-50">
                              <div>
                                <div className="font-medium text-custom-grey">{t.socialSecurity}</div>
                                <div className="text-sm text-gray-500">9.5% of {formatCurrency(individualResults.monthly.socialSecurityBase)}</div>
                                <div className="text-xs text-gray-400 mt-1">{t.socialSecurityInfo}</div>
                              </div>
                              <div className="text-right">
                                <div className="font-bold text-custom-grey">{formatCurrency(individualResults.monthly.employeeSocialSecurity)}</div>
                              </div>
                            </div>
                            <div className="px-6 py-4 flex justify-between items-center">
                              <div>
                                <div className="font-medium text-custom-grey">{t.incomeTax}</div>
                                <div className="text-sm text-gray-500">{t.progressive}: 13% (0-170K) / 23% (>170K)</div>
                              </div>
                              <div className="text-right">
                                <div className="font-bold text-custom-grey">{formatCurrency(individualResults.monthly.incomeTax)}</div>
                              </div>
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {calculatorType === 'company' && (
                <div className="max-w-6xl mx-auto px-4 pb-8">
                  <div className="grid lg:grid-cols-3 gap-6">
                    <div className="lg:col-span-1">
                      <div className="bg-white rounded-lg shadow-md p-6 sticky top-4 border-2 border-custom-grey">
                        <h2 className="text-xl font-bold text-custom-grey mb-6">{t.companyDetails}</h2>
                        
                        <div className="mb-6">
                          <label className="block text-sm font-semibold text-custom-grey mb-3">{t.currency}</label>
                          <div className="grid grid-cols-3 gap-2">
                            {['ALL', 'EUR', 'USD'].map(curr => (
                              <button key={curr} onClick={() => setCompanyCurrency(curr)} className={`py-2 px-3 rounded-lg font-medium transition-all ${companyCurrency === curr ? 'bg-custom-green text-white shadow' : 'bg-gray-100 text-custom-grey hover:bg-gray-200'}`}>
                                {curr}
                              </button>
                            ))}
                          </div>
                        </div>

                        <div className="mb-6">
                          <label className="block text-sm font-semibold text-custom-grey mb-2">{t.annualRevenue}</label>
                          <div className="relative">
                            <input type="number" value={companyRevenue} onChange={(e) => setCompanyRevenue(e.target.value)} className="w-full px-4 py-3 pr-16 border-2 border-custom-grey rounded-lg focus:border-custom-green focus:outline-none text-lg font-semibold" />
                            <span className="absolute right-4 top-1/2 transform -translate-y-1/2 text-custom-grey font-medium">{companyCurrency}</span>
                          </div>
                        </div>

                        <div className="mb-6">
                          <label className="block text-sm font-semibold text-custom-grey mb-2">{t.annualExpenses}</label>
                          <div className="relative">
                            <input type="number" value={companyExpenses} onChange={(e) => setCompanyExpenses(e.target.value)} className="w-full px-4 py-3 pr-16 border-2 border-custom-grey rounded-lg focus:border-custom-green focus:outline-none text-lg font-semibold" />
                            <span className="absolute right-4 top-1/2 transform -translate-y-1/2 text-custom-grey font-medium">{companyCurrency}</span>
                          </div>
                        </div>

                        <div className="mb-6">
                          <label className="block text-sm font-semibold text-custom-grey mb-2">{t.adjustments}</label>
                          <div className="relative">
                            <input type="number" value={companyAdjustments} onChange={(e) => setCompanyAdjustments(e.target.value)} className="w-full px-4 py-3 pr-16 border-2 border-custom-grey rounded-lg focus:border-custom-green focus:outline-none text-lg font-semibold" placeholder="0" />
                            <span className="absolute right-4 top-1/2 transform -translate-y-1/2 text-custom-grey font-medium">{companyCurrency}</span>
                          </div>
                          <p className="text-xs text-gray-500 mt-2">{t.adjustmentsInfo}</p>
                        </div>

                        <div className="mb-6">
                          <label className="block text-sm font-semibold text-custom-grey mb-2">{t.industrySector}</label>
                          <select value={companyIndustry} onChange={(e) => setCompanyIndustry(e.target.value)} className="w-full px-4 py-3 border-2 border-custom-grey rounded-lg focus:border-custom-green focus:outline-none text-base font-medium bg-white">
                            {Object.keys(industries).map((key) => (
                              <option key={key} value={key}>{t.industries[key].name} ({industries[key].rate === 0 ? '0%' : `${industries[key].rate * 100}%`})</option>
                            ))}
                          </select>
                          <p className="text-xs text-custom-grey mt-2">{t.industries[companyIndustry].description}</p>
                        </div>

                        <div className="bg-green-50 border-2 border-custom-green rounded-lg p-4">
                          <div className="flex gap-2">
                            <Info />
                            <div className="text-sm text-custom-green">
                              <p className="font-semibold mb-1">{t.corporateTax}</p>
                              <p className="text-xs">{t.taxOnProfit}</p>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div className="lg:col-span-2 space-y-6">
                      <div className="bg-gradient-to-br from-custom-green to-[#003314] rounded-lg shadow-lg p-8 text-white border-2 border-custom-green">
                        <div className="flex items-center gap-2 mb-2">
                          <Building2 />
                          <h2 className="text-lg font-semibold">{t.netProfit}</h2>
                        </div>
                        <div className="flex items-baseline gap-4">
                          <div className="text-5xl font-bold">{formatCurrency(companyResults.netProfit, companyCurrency)}</div>
                        </div>
                        <div className="mt-4 pt-4 border-t border-green-400 grid grid-cols-2 gap-4">
                          <div>
                            <div className="text-green-100 text-sm">{t.taxRate}</div>
                            <div className="text-2xl font-bold mt-1">{companyResults.taxRate.toFixed(1)}%</div>
                          </div>
                          <div>
                            <div className="text-green-100 text-sm">{t.effectiveRate}</div>
                            <div className="text-2xl font-bold mt-1">{companyResults.effectiveRate.toFixed(2)}%</div>
                          </div>
                        </div>
                      </div>

                      <div className="grid md:grid-cols-2 gap-4">
                        <div className="bg-white rounded-lg shadow p-5 border-l-4 border-green-500">
                          <div className="text-sm text-custom-grey mb-1">{t.totalRevenue}</div>
                          <div className="text-2xl font-bold text-custom-grey">{formatCurrency(companyResults.revenue, companyCurrency)}</div>
                        </div>
                        <div className="bg-white rounded-lg shadow p-5 border-l-4 border-custom-grey">
                          <div className="text-sm text-custom-grey mb-1">{t.totalExpenses}</div>
                          <div className="text-2xl font-bold text-custom-grey">{formatCurrency(companyResults.expenses, companyCurrency)}</div>
                        </div>
                        <div className="bg-white rounded-lg shadow p-5 border-l-4 border-blue-500">
                          <div className="text-sm text-custom-grey mb-1">{t.totalAdjustments}</div>
                          <div className="text-2xl font-bold text-custom-grey">{formatCurrency(companyResults.adjustments, companyCurrency)}</div>
                        </div>
                        <div className="bg-white rounded-lg shadow p-5 border-l-4 border-custom-green">
                          <div className="text-sm text-custom-grey mb-1">{t.grossProfit}</div>
                          <div className="text-2xl font-bold text-custom-grey">{formatCurrency(companyResults.grossProfit, companyCurrency)}</div>
                        </div>
                      </div>

                      <div className="bg-white rounded-lg shadow overflow-hidden border-2 border-custom-grey">
                        <div className="bg-gray-100 px-6 py-3 border-b-2 border-custom-grey">
                          <h3 className="font-bold text-custom-grey">{t.taxCalculation}</h3>
                        </div>
                        <div className="divide-y divide-gray-200">
                          <div className="px-6 py-4 flex justify-between items-center">
                            <div>
                              <div className="font-medium text-custom-grey">{t.industry}</div>
                              <div className="text-sm text-gray-500">{t.industries[companyIndustry].name}</div>
                            </div>
                            <div className="font-bold text-custom-grey">{companyResults.taxRate.toFixed(1)}%</div>
                          </div>
                          <div className="px-6 py-4 flex justify-between items-center">
                            <div>
                              <div className="font-medium text-custom-grey">{t.grossProfit}</div>
                              <div className="text-sm text-gray-500">{t.revenueMinusExpenses}</div>
                            </div>
                            <div className="text-right">
                              <div className="font-bold text-custom-grey">{formatCurrency(companyResults.grossProfit, companyCurrency)}</div>
                            </div>
                          </div>
                          <div className="px-6 py-4 flex justify-between items-center bg-blue-50">
                            <div>
                              <div className="font-medium text-custom-grey">{t.totalAdjustments}</div>
                              <div className="text-sm text-gray-500">{t.plusAdjustments}</div>
                            </div>
                            <div className="text-right">
                              <div className="font-bold text-custom-grey">{formatCurrency(companyResults.adjustments, companyCurrency)}</div>
                            </div>
                          </div>
                          <div className="px-6 py-4 flex justify-between items-center bg-gray-50">
                            <div>
                              <div className="font-medium text-custom-grey">{t.taxableProfit}</div>
                              <div className="text-sm text-gray-500">{t.grossProfit} {t.plusAdjustments}</div>
                            </div>
                            <div className="text-right">
                              <div className="font-bold text-custom-grey text-lg">{formatCurrency(companyResults.taxableProfit, companyCurrency)}</div>
                            </div>
                          </div>
                          <div className="px-6 py-4 flex justify-between items-center bg-gray-50">
                            <div>
                              <div className="font-medium text-custom-grey">{t.corporateTax}</div>
                              <div className="text-sm text-gray-500">{companyResults.taxRate.toFixed(1)}% {t.ofProfit}</div>
                            </div>
                            <div className="text-right">
                              <div className="font-bold text-custom-grey text-lg">{formatCurrency(companyResults.corporateTax, companyCurrency)}</div>
                            </div>
                          </div>
                          <div className="px-6 py-4 flex justify-between items-center bg-green-50">
                            <div className="font-bold text-custom-grey">{t.netProfit}</div>
                            <div className="text-right">
                              <div className="font-bold text-custom-green text-lg">{formatCurrency(companyResults.netProfit, companyCurrency)}</div>
                            </div>
                          </div>
                        </div>
                      </div>

                      <div className="bg-gradient-to-r from-gray-50 to-gray-100 border-2 border-custom-grey rounded-lg p-6">
                        <h3 className="font-bold text-custom-grey mb-3 flex items-center gap-2">
                          <Info />
                          {t.corporateTaxRates}
                        </h3>
                        <div className="space-y-3 text-sm">
                          <div className="bg-white rounded-lg p-3 border-2 border-custom-grey">
                            <div className="font-semibold text-custom-grey mb-1">{t.standardRate}</div>
                            <div className="text-xs text-gray-600">{t.standardDesc}</div>
                          </div>
                          <div className="bg-white rounded-lg p-3 border-2 border-custom-green">
                            <div className="font-semibold text-custom-green mb-1">{t.itRate}</div>
                            <div className="text-xs text-gray-600">{t.itDesc}</div>
                          </div>
                          <div className="bg-white rounded-lg p-3 border-2 border-custom-grey">
                            <div className="font-semibold text-custom-grey mb-1">{t.agricultureRate}</div>
                            <div className="text-xs text-gray-600">{t.agricultureDesc}</div>
                          </div>
                          <div className="bg-white rounded-lg p-3 border-2 border-custom-grey">
                            <div className="font-semibold text-custom-grey mb-1">{t.automotiveRate}</div>
                            <div className="text-xs text-gray-600">{t.automotiveDesc}</div>
                          </div>
                          <div className="bg-white rounded-lg p-3 border-2 border-custom-grey">
                            <div className="font-semibold text-custom-grey mb-1">{t.smallBusinessRate}</div>
                            <div className="text-xs text-gray-600">{t.smallBusinessDesc}</div>
                          </div>
                          <div className="bg-white rounded-lg p-3 border-2 border-custom-grey">
                            <div className="font-semibold text-custom-grey mb-1">{t.mediumBusinessRate}</div>
                            <div className="text-xs text-gray-600">{t.mediumBusinessDesc}</div>
                          </div>
                          <div className="bg-white rounded-lg p-3 border-2 border-custom-grey">
                            <div className="font-semibold text-custom-grey mb-1">{t.selfEmployedSmallRate}</div>
                            <div className="text-xs text-gray-600">{t.selfEmployedSmallDesc}</div>
                          </div>
                          <div className="bg-white rounded-lg p-3 border-2 border-custom-grey">
                            <div className="font-semibold text-custom-grey mb-1">{t.selfEmployedLargeRate}</div>
                            <div className="text-xs text-gray-600">{t.selfEmployedLargeDesc}</div>
                          </div>
                          <div className="bg-white rounded-lg p-3 border-2 border-custom-grey">
                            <div className="font-semibold text-custom-grey mb-1">{t.luxuryHotelRate}</div>
                            <div className="text-xs text-gray-600">{t.luxuryHotelDesc}</div>
                          </div>
                        </div>
                        {companyIndustry === 'it' && (
                          <div className="mt-4 pt-4 border-t-2 border-custom-grey">
                            <p className="text-xs font-bold text-red-700 mb-2">{t.itNotice}</p>
                            <p className="text-xs text-custom-grey">{t.itNoticeText}</p>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                </div>
              )}

              <div className="bg-custom-grey border-t-4 border-custom-green">
                <div className="max-w-6xl mx-auto px-4 py-8">
                  <div className="text-center text-sm text-white">
                    <p className="font-semibold">{t.disclaimer}</p>
                    <p className="mt-2">{t.officialInfo}</p>
                  </div>
                </div>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AlbaniaSalaryCalculator />);
    </script>
</body>
</html>
