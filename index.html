<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Albania Salary Calculator 2026 | Net Wage & Corporate Tax Calculator | Llogaritësi i Pagës Shqipëri</title>
    <meta name="title" content="Albania Salary Calculator 2026 | Net Wage & Corporate Tax Calculator">
    <meta name="description" content="Free Albania salary calculator 2026. Calculate net salary, income tax, social security, and corporate taxes in Albania. Supports ALL, EUR, USD. Updated with latest Albanian tax rates. Llogaritësi i pagës Shqipëri.">
    <meta name="keywords" content="albania salary calculator, llogaritësi i pagës, wage calculator albania, net salary albania, albanian tax calculator, shqipëri paga, taksat shqipëri, income tax albania, corporate tax albania, IT sector tax albania, salary calculator shqip">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English, Albanian">
    <meta name="author" content="Albania Tax Calculator">
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://albania-salary-calculator.netlify.app/">
    <meta property="og:title" content="Albania Salary Calculator 2026 - Calculate Net Salary & Corporate Tax">
    <meta property="og:description" content="Free calculator for Albanian salaries and corporate taxes. Calculate net pay after income tax, social security, and health insurance. Multi-currency support.">
    <meta property="og:image" content="https://flagcdn.com/w1280/al.png">
    
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://albania-salary-calculator.netlify.app/">
    <meta property="twitter:title" content="Albania Salary Calculator 2026">
    <meta property="twitter:description" content="Calculate net salary and corporate taxes in Albania with 2026 tax rates. Free tool with ALL, EUR, USD support.">
    <meta property="twitter:image" content="https://flagcdn.com/w1280/al.png">
    
    <link rel="canonical" href="https://albania-salary-calculator.netlify.app/">
    
    <meta name="geo.region" content="AL">
    <meta name="geo.placename" content="Albania">
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Albania Salary Calculator 2026",
      "description": "Calculate net salary and corporate taxes in Albania with 2026 tax rates",
      "url": "https://albania-salary-calculator.netlify.app/",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "ALL"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "5",
        "ratingCount": "1"
      }
    }
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'custom-green': '#00441B',
                        'custom-grey': '#55565B',
                    }
                }
            }
        }
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇦🇱</text></svg>">
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState } = React;
        
        const Calculator = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="10" x2="8" y2="10"/><line x1="8" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="10" y2="18"/><line x1="14" y1="18" x2="16" y2="18"/></svg>;
        const Info = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>;
        const TrendingUp = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>;
        const TrendingDown = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>;
        const User = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
        const Building2 = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>;

        const AlbaniaSalaryCalculator = () => {
          const [calculatorType, setCalculatorType] = useState('individual');
          const [grossSalary, setGrossSalary] = useState('80000');
          const [currency, setCurrency] = useState('ALL');
          const [period, setPeriod] = useState('monthly');
          const [showBreakdown, setShowBreakdown] = useState(true);
          const [companyRevenue, setCompanyRevenue] = useState('10000000');
          const [companyExpenses, setCompanyExpenses] = useState('7000000');
          const [companyIndustry, setCompanyIndustry] = useState('standard');
          const [companyCurrency, setCompanyCurrency] = useState('ALL');

          const industries = {
            'standard': { name: 'Standard Business', rate: 0.15, description: 'Most businesses (retail, manufacturing, services, etc.)' },
            'it': { name: 'IT / Software Development', rate: 0.15, description: '15% from January 1, 2026 (changed from 5%)' },
            'agriculture': { name: 'Agricultural Cooperatives', rate: 0.05, description: '5% until Dec 31, 2029' },
            'agritourism': { name: 'Agritourism (Certified)', rate: 0.05, description: '5% until Dec 31, 2029' },
            'automotive': { name: 'Automotive Industry', rate: 0.05, description: '5% until Dec 31, 2029' },
            'smallbusiness': { name: 'Small Business (< 14M ALL/year)', rate: 0, description: '0% until Dec 31, 2029' },
            'luxury-hotel': { name: '4-5 Star Hotels (International Brand)', rate: 0, description: '0% for 10 years (special status)' }
          };

          const calculateIndividualTax = () => {
            let monthlyGross = parseFloat(grossSalary) || 0;
            if (period === 'annual') monthlyGross = monthlyGross / 12;
            
            const contributionBase = Math.min(Math.max(monthlyGross, 45000), 310000);
            const employeeSocialSecurity = contributionBase * 0.095;
            const employeeHealth = contributionBase * 0.017;
            const totalEmployeeContributions = employeeSocialSecurity + employeeHealth;
            const employerSocialSecurity = contributionBase * 0.15;
            const employerHealth = contributionBase * 0.017;
            const totalEmployerContributions = employerSocialSecurity + employerHealth;
            const taxableIncome = monthlyGross - totalEmployeeContributions;
            
            let incomeTax = 0;
            if (taxableIncome <= 50000) {
              incomeTax = 0;
            } else if (taxableIncome <= 60000) {
              incomeTax = (taxableIncome - 35000) * 0.13;
            } else {
              if (taxableIncome <= 200000) {
                incomeTax = (taxableIncome - 30000) * 0.13;
              } else {
                incomeTax = ((200000 - 30000) * 0.13) + ((taxableIncome - 200000) * 0.23);
              }
            }
            
            const netSalary = taxableIncome - incomeTax;
            const totalCost = monthlyGross + totalEmployerContributions;
            
            return {
              monthly: {
                gross: monthlyGross,
                employeeSocialSecurity,
                employeeHealth,
                totalEmployeeContributions,
                incomeTax,
                net: netSalary,
                totalDeductions: totalEmployeeContributions + incomeTax,
                employerSocialSecurity,
                employerHealth,
                totalEmployerContributions,
                totalCost
              },
              annual: {
                gross: monthlyGross * 12,
                net: netSalary * 12
              }
            };
          };

          const calculateCompanyTax = () => {
            const revenue = parseFloat(companyRevenue) || 0;
            const expenses = parseFloat(companyExpenses) || 0;
            const profit = revenue - expenses;
            const industry = industries[companyIndustry];
            const taxRate = industry.rate;
            const corporateTax = profit > 0 ? profit * taxRate : 0;
            const netProfit = profit - corporateTax;
            
            return {
              revenue,
              expenses,
              profit,
              corporateTax,
              netProfit,
              taxRate: taxRate * 100,
              effectiveRate: profit > 0 ? (corporateTax / profit) * 100 : 0,
              industry
            };
          };

          const individualResults = calculateIndividualTax();
          const companyResults = calculateCompanyTax();

          const formatCurrency = (amount, curr = currency) => {
            return new Intl.NumberFormat('sq-AL', {
              style: 'currency',
              currency: curr,
              minimumFractionDigits: 0,
              maximumFractionDigits: 0
            }).format(amount);
          };

          return (
            <div className="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100">
              {/* Header */}
              <div className="bg-gradient-to-r from-custom-green via-custom-green to-[#003314] text-white py-8 px-4 shadow-lg">
                <div className="max-w-6xl mx-auto">
                  <div className="flex items-center gap-3 mb-2">
                    <Calculator />
                    <h1 className="text-4xl font-bold">Albania Tax Calculator</h1>
                  </div>
                  <p className="text-green-100 text-lg">Calculate taxes for individuals and companies - Updated for 2026</p>
                </div>
              </div>

              {/* Calculator Type Selector */}
              <div className="max-w-6xl mx-auto px-4 py-6">
                <div className="bg-white rounded-xl shadow-lg p-2 inline-flex gap-2 border-2 border-custom-grey">
                  <button
                    onClick={() => setCalculatorType('individual')}
                    className={`flex items-center gap-2 px-6 py-3 rounded-lg font-semibold transition-all ${
                      calculatorType === 'individual' ? 'bg-custom-green text-white shadow-md' : 'bg-gray-100 text-custom-grey hover:bg-gray-200'
                    }`}
                  >
                    <User />
                    Individual / Employee
                  </button>
                  <button
                    onClick={() => setCalculatorType('company')}
                    className={`flex items-center gap-2 px-6 py-3 rounded-lg font-semibold transition-all ${
                      calculatorType === 'company' ? 'bg-custom-green text-white shadow-md' : 'bg-gray-100 text-custom-grey hover:bg-gray-200'
                    }`}
                  >
                    <Building2 />
                    Company / Business
                  </button>
                </div>
              </div>

              {/* INDIVIDUAL CALCULATOR */}
              {calculatorType === 'individual' && (
                <div className="max-w-6xl mx-auto px-4 pb-8">
                  <div className="grid lg:grid-cols-3 gap-6">
                    <div className="lg:col-span-1">
                      <div className="bg-white rounded-lg shadow-md p-6 sticky top-4 border-2 border-custom-grey">
                        <h2 className="text-xl font-bold text-custom-grey mb-6">Salary Details</h2>
                        
                        <div className="mb-6">
                          <label className="block text-sm font-semibold text-custom-grey mb-3">Pay Period</label>
                          <div className="grid grid-cols-2 gap-2">
                            {['monthly', 'annual'].map(p => (
                              <button key={p} onClick={() => setPeriod(p)} className={`py-2 px-4 rounded-lg font-medium transition-all ${period === p ? 'bg-custom-green text-white shadow' : 'bg-gray-100 text-custom-grey hover:bg-gray-200'}`}>
                                {p === 'monthly' ? 'Monthly' : 'Annual'}
                              </button>
                            ))}
                          </div>
                        </div>

                        <div className="mb-6">
                          <label className="block text-sm font-semibold text-custom-grey mb-3">Currency</label>
                          <div className="grid grid-cols-3 gap-2">
                            {['ALL', 'EUR', 'USD'].map(curr => (
                              <button key={curr} onClick={() => setCurrency(curr)} className={`py-2 px-3 rounded-lg font-medium transition-all ${currency === curr ? 'bg-custom-green text-white shadow' : 'bg-gray-100 text-custom-grey hover:bg-gray-200'}`}>
                                {curr}
                              </button>
                            ))}
                          </div>
                        </div>

                        <div className="mb-6">
                          <label className="block text-sm font-semibold text-custom-grey mb-2">Gross {period === 'monthly' ? 'Monthly' : 'Annual'} Salary</label>
                          <div className="relative">
                            <input type="number" value={grossSalary} onChange={(e) => setGrossSalary(e.target.value)} className="w-full px-4 py-3 pr-16 border-2 border-custom-grey rounded-lg focus:border-custom-green focus:outline-none text-lg font-semibold" placeholder="80000" />
                            <span className="absolute right-4 top-1/2 transform -translate-y-1/2 text-custom-grey font-medium">{currency}</span>
                          </div>
                        </div>

                        <div className="bg-green-50 border-2 border-custom-green rounded-lg p-4">
                          <div className="flex gap-2">
                            <Info />
                            <div className="text-sm text-custom-green">
                              <p className="font-semibold mb-1">2026 Tax Rates</p>
                              <ul className="space-y-1 text-xs">
                                <li>• Social Security: 9.5%</li>
                                <li>• Health Insurance: 1.7%</li>
                                <li>• Income Tax: 0%, 13%, or 23%</li>
                              </ul>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div className="lg:col-span-2 space-y-6">
                      <div className="bg-gradient-to-br from-green-500 to-green-600 rounded-lg shadow-lg p-8 text-white border-2 border-green-700">
                        <div className="flex items-center gap-2 mb-2">
                          <TrendingUp />
                          <h2 className="text-lg font-semibold">Your Net Salary</h2>
                        </div>
                        <div className="flex items-baseline gap-4">
                          <div className="text-5xl font-bold">{formatCurrency(individualResults.monthly.net)}</div>
                          <div className="text-green-100 text-lg">/ month</div>
                        </div>
                        <div className="mt-4 pt-4 border-t border-green-400">
                          <div className="text-green-100 text-sm">Annual Net Salary</div>
                          <div className="text-2xl font-bold mt-1">{formatCurrency(individualResults.annual.net)}</div>
                        </div>
                      </div>

                      <div className="grid md:grid-cols-3 gap-4">
                        <div className="bg-white rounded-lg shadow p-5 border-l-4 border-custom-green">
                          <div className="text-sm text-custom-grey mb-1">Gross Salary</div>
                          <div className="text-2xl font-bold text-custom-grey">{formatCurrency(individualResults.monthly.gross)}</div>
                        </div>
                        <div className="bg-white rounded-lg shadow p-5 border-l-4 border-custom-grey">
                          <div className="text-sm text-custom-grey mb-1">Total Deductions</div>
                          <div className="text-2xl font-bold text-custom-grey">{formatCurrency(individualResults.monthly.totalDeductions)}</div>
                        </div>
                        <div className="bg-white rounded-lg shadow p-5 border-l-4 border-custom-green">
                          <div className="text-sm text-custom-grey mb-1">Cost to Employer</div>
                          <div className="text-2xl font-bold text-custom-green">{formatCurrency(individualResults.monthly.totalCost)}</div>
                        </div>
                      </div>

                      <button onClick={() => setShowBreakdown(!showBreakdown)} className="w-full bg-white rounded-lg shadow p-4 text-left font-semibold text-custom-grey hover:bg-gray-50 transition-colors flex items-center justify-between border-2 border-custom-grey">
                        <span>Detailed Breakdown</span>
                        <span className="text-2xl">{showBreakdown ? '−' : '+'}</span>
                      </button>

                      {showBreakdown && (
                        <div className="bg-white rounded-lg shadow overflow-hidden border-2 border-custom-grey">
                          <div className="bg-gray-100 px-6 py-3 border-b-2 border-custom-grey">
                            <h3 className="font-bold text-custom-grey flex items-center gap-2">
                              <TrendingDown />
                              Employee Deductions
                            </h3>
                          </div>
                          <div className="divide-y divide-gray-200">
                            <div className="px-6 py-4 flex justify-between items-center">
                              <div>
                                <div className="font-medium text-custom-grey">Social Security</div>
                                <div className="text-sm text-gray-500">9.5%</div>
                              </div>
                              <div className="text-right">
                                <div className="font-bold text-custom-grey">{formatCurrency(individualResults.monthly.employeeSocialSecurity)}</div>
                              </div>
                            </div>
                            <div className="px-6 py-4 flex justify-between items-center">
                              <div>
                                <div className="font-medium text-custom-grey">Health Insurance</div>
                                <div className="text-sm text-gray-500">1.7%</div>
                              </div>
                              <div className="text-right">
                                <div className="font-bold text-custom-grey">{formatCurrency(individualResults.monthly.employeeHealth)}</div>
                              </div>
                            </div>
                            <div className="px-6 py-4 flex justify-between items-center">
                              <div>
                                <div className="font-medium text-custom-grey">Income Tax</div>
                                <div className="text-sm text-gray-500">Progressive</div>
                              </div>
                              <div className="text-right">
                                <div className="font-bold text-custom-grey">{formatCurrency(individualResults.monthly.incomeTax)}</div>
                              </div>
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {/* COMPANY CALCULATOR */}
              {calculatorType === 'company' && (
                <div className="max-w-6xl mx-auto px-4 pb-8">
                  <div className="grid lg:grid-cols-3 gap-6">
                    <div className="lg:col-span-1">
                      <div className="bg-white rounded-lg shadow-md p-6 sticky top-4 border-2 border-custom-grey">
                        <h2 className="text-xl font-bold text-custom-grey mb-6">Company Details</h2>
                        
                        <div className="mb-6">
                          <label className="block text-sm font-semibold text-custom-grey mb-3">Currency</label>
                          <div className="grid grid-cols-3 gap-2">
                            {['ALL', 'EUR', 'USD'].map(curr => (
                              <button key={curr} onClick={() => setCompanyCurrency(curr)} className={`py-2 px-3 rounded-lg font-medium transition-all ${companyCurrency === curr ? 'bg-custom-green text-white shadow' : 'bg-gray-100 text-custom-grey hover:bg-gray-200'}`}>
                                {curr}
                              </button>
                            ))}
                          </div>
                        </div>

                        <div className="mb-6">
                          <label className="block text-sm font-semibold text-custom-grey mb-2">Annual Revenue</label>
                          <div className="relative">
                            <input type="number" value={companyRevenue} onChange={(e) => setCompanyRevenue(e.target.value)} className="w-full px-4 py-3 pr-16 border-2 border-custom-grey rounded-lg focus:border-custom-green focus:outline-none text-lg font-semibold" />
                            <span className="absolute right-4 top-1/2 transform -translate-y-1/2 text-custom-grey font-medium">{companyCurrency}</span>
                          </div>
                        </div>

                        <div className="mb-6">
                          <label className="block text-sm font-semibold text-custom-grey mb-2">Annual Expenses</label>
                          <div className="relative">
                            <input type="number" value={companyExpenses} onChange={(e) => setCompanyExpenses(e.target.value)} className="w-full px-4 py-3 pr-16 border-2 border-custom-grey rounded-lg focus:border-custom-green focus:outline-none text-lg font-semibold" />
                            <span className="absolute right-4 top-1/2 transform -translate-y-1/2 text-custom-grey font-medium">{companyCurrency}</span>
                          </div>
                        </div>

                        <div className="mb-6">
                          <label className="block text-sm font-semibold text-custom-grey mb-2">Industry / Sector</label>
                          <select value={companyIndustry} onChange={(e) => setCompanyIndustry(e.target.value)} className="w-full px-4 py-3 border-2 border-custom-grey rounded-lg focus:border-custom-green focus:outline-none text-base font-medium bg-white">
                            {Object.entries(industries).map(([key, industry]) => (
                              <option key={key} value={key}>{industry.name} ({industry.rate === 0 ? '0%' : `${industry.rate * 100}%`})</option>
                            ))}
                          </select>
                          <p className="text-xs text-custom-grey mt-2">{industries[companyIndustry].description}</p>
                        </div>

                        <div className="bg-green-50 border-2 border-custom-green rounded-lg p-4">
                          <div className="flex gap-2">
                            <Info />
                            <div className="text-sm text-custom-green">
                              <p className="font-semibold mb-1">Corporate Tax</p>
                              <p className="text-xs">Tax on net profit (revenue - expenses)</p>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div className="lg:col-span-2 space-y-6">
                      <div className="bg-gradient-to-br from-custom-green to-[#003314] rounded-lg shadow-lg p-8 text-white border-2 border-custom-green">
                        <div className="flex items-center gap-2 mb-2">
                          <Building2 />
                          <h2 className="text-lg font-semibold">Net Profit (After Tax)</h2>
                        </div>
                        <div className="flex items-baseline gap-4">
                          <div className="text-5xl font-bold">{formatCurrency(companyResults.netProfit, companyCurrency)}</div>
                        </div>
                        <div className="mt-4 pt-4 border-t border-green-400 grid grid-cols-2 gap-4">
                          <div>
                            <div className="text-green-100 text-sm">Tax Rate</div>
                            <div className="text-2xl font-bold mt-1">{companyResults.taxRate.toFixed(1)}%</div>
                          </div>
                          <div>
                            <div className="text-green-100 text-sm">Effective Rate</div>
                            <div className="text-2xl font-bold mt-1">{companyResults.effectiveRate.toFixed(2)}%</div>
                          </div>
                        </div>
                      </div>

                      <div className="grid md:grid-cols-3 gap-4">
                        <div className="bg-white rounded-lg shadow p-5 border-l-4 border-green-500">
                          <div className="text-sm text-custom-grey mb-1">Total Revenue</div>
                          <div className="text-2xl font-bold text-custom-grey">{formatCurrency(companyResults.revenue, companyCurrency)}</div>
                        </div>
                        <div className="bg-white rounded-lg shadow p-5 border-l-4 border-custom-grey">
                          <div className="text-sm text-custom-grey mb-1">Total Expenses</div>
                          <div className="text-2xl font-bold text-custom-grey">{formatCurrency(companyResults.expenses, companyCurrency)}</div>
                        </div>
                        <div className="bg-white rounded-lg shadow p-5 border-l-4 border-custom-green">
                          <div className="text-sm text-custom-grey mb-1">Gross Profit</div>
                          <div className="text-2xl font-bold text-custom-grey">{formatCurrency(companyResults.profit, companyCurrency)}</div>
                        </div>
                      </div>

                      <div className="bg-white rounded-lg shadow overflow-hidden border-2 border-custom-grey">
                        <div className="bg-gray-100 px-6 py-3 border-b-2 border-custom-grey">
                          <h3 className="font-bold text-custom-grey">Tax Calculation Breakdown</h3>
                            </div>
                                <div className="divide-y divide-gray-200">
                                <div className="px-6 py-4 flex justify-between items-center">
                            <div>
                                <div className="font-medium text-custom-grey">Industry</div>
                                <div className="text-sm text-gray-500">{companyResults.industry.name}</div>
                            </div>
                                <div className="font-bold text-custom-grey">{companyResults.taxRate.toFixed(1)}%</div>
                            </div>
                                <div className="px-6 py-4 flex justify-between items-center">
                            <div>
                                <div className="font-medium text-custom-grey">Taxable Profit</div>
                                <div className="text-sm text-gray-500">Revenue - Expenses</div>
                            </div>
                                <div className="text-right">
                                <div className="font-bold text-custom-grey">{formatCurrency(companyResults.profit, companyCurrency)}</div>
                            </div>
                            </div>
                                <div className="px-6 py-4 flex justify-between items-center bg-gray-50">
                            <div>
                                <div className="font-medium text-custom-grey">Corporate Tax</div>
                                <div className="text-sm text-gray-500">{companyResults.taxRate.toFixed(1)}% of profit</div>
                            </div>
                                <div className="text-right">
                            <div className="font-bold text-custom-grey text-lg">{formatCurrency(companyResults.corporateTax, companyCurrency)}</div>
                            </div>
                            </div>
                                <div className="px-6 py-4 flex justify-between items-center bg-green-50">
                                <div className="font-bold text-custom-grey">Net Profit (After Tax)</div>
                                <div className="text-right">
                            <div className="font-bold text-custom-green text-lg">{formatCurrency(companyResults.netProfit, companyCurrency)}</div>
                            </div>
                            </div>
                            </div>
                            </div>
                            <div className="bg-gradient-to-r from-gray-50 to-gray-100 border-2 border-custom-grey rounded-lg p-6">
                    <h3 className="font-bold text-custom-grey mb-3 flex items-center gap-2">
                      <Info />
                      Albania Corporate Tax Rates 2026
                    </h3>
                    <div className="space-y-3 text-sm">
                      <div className="bg-white rounded-lg p-3 border-2 border-custom-grey">
                        <div className="font-semibold text-custom-grey mb-1">🏢 Standard Rate: 15%</div>
                        <div className="text-xs text-gray-600">Most businesses (retail, manufacturing, services, etc.)</div>
                      </div>
                      <div className="bg-white rounded-lg p-3 border-2 border-custom-green">
                        <div className="font-semibold text-custom-green mb-1">💻 IT/Software: 15% (Changed!)</div>
                        <div className="text-xs text-gray-600">From January 1, 2026 (previously 5%)</div>
                      </div>
                      <div className="bg-white rounded-lg p-3 border-2 border-custom-grey">
                        <div className="font-semibold text-custom-grey mb-1">🌾 Agriculture & Agritourism: 5%</div>
                        <div className="text-xs text-gray-600">Agricultural cooperatives and certified agritourism until Dec 31, 2029</div>
                      </div>
                      <div className="bg-white rounded-lg p-3 border-2 border-custom-grey">
                        <div className="font-semibold text-custom-grey mb-1">🚗 Automotive Industry: 5%</div>
                        <div className="text-xs text-gray-600">Until Dec 31, 2029</div>
                      </div>
                      <div className="bg-white rounded-lg p-3 border-2 border-custom-grey">
                        <div className="font-semibold text-custom-grey mb-1">💼 Small Business: 0%</div>
                        <div className="text-xs text-gray-600">Annual income below 14 million ALL until Dec 31, 2029</div>
                      </div>
                      <div className="bg-white rounded-lg p-3 border-2 border-custom-grey">
                        <div className="font-semibold text-custom-grey mb-1">🏨 Luxury Hotels: 0%</div>
                        <div className="text-xs text-gray-600">4-5 star hotels with international brand status for 10 years</div>
                      </div>
                    </div>
                    {companyIndustry === 'it' && (
                      <div className="mt-4 pt-4 border-t-2 border-custom-grey">
                        <p className="text-xs font-bold text-red-700 mb-2">⚠️ Important Notice for IT Sector:</p>
                        <p className="text-xs text-custom-grey">From January 1, 2026, IT companies now pay standard 15% corporate tax (increased from 5%). This change generates an additional 523 million lekë in government revenue.<br /><br /><strong>Affected businesses:</strong> 3,574 IT service companies + 556 information service companies in Albania.</p>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

          <div className="bg-custom-grey border-t-4 border-custom-green">
            <div className="max-w-6xl mx-auto px-4 py-8">
              <div className="text-center text-sm text-white">
                <p className="font-semibold">This calculator uses 2026 Albania tax rates.</p>
                <p className="mt-2">For official information, consult the Albanian Tax Administration.</p>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AlbaniaSalaryCalculator />);
</script>
</body>
</html>
